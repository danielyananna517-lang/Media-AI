name: Novessa Core verification

on:
  push:
    branches:
      - novessa-core-0.4.9-vercel
  pull_request:
    branches:
      - main
    paths:
      - 'novessa-core/**'
      - '.github/workflows/novessa-core-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Core
        working-directory: novessa-core
        run: node build.mjs
      - name: Run Core tests
        working-directory: novessa-core
        run: npm test
